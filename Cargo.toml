[workspace]
members = ["."]
resolver = "2"

[package]
name = "sen-ocr"
version = "0.1.1"
edition = "2021"
description = "SenClaw OCR runtime: PaddleOCR (PP-OCRv4/v5) on the MNN inference backend"
license = "MIT"
repository = "https://github.com/SenClaw/sen-ocr"

[[bin]]
name = "sen-ocr"
path = "src/main.rs"

[dependencies]
sen-runtime-sdk = { path = "../senclaw/crates/sen-runtime-sdk" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["json"] }
axum-extra = { version = "0.9", features = ["multipart"] }
once_cell = "1"
futures = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }

# Pure-Rust OCR via PaddleOCR + MNN backend (cross-platform; CPU by default).
# `image` decodes PNG/JPEG/WebP/BMP/GIF inputs for the recognizer.
ocr-rs = { git = "https://github.com/zibo-chen/rust-paddle-ocr.git", branch = "next", optional = true, default-features = false }
image = { version = "0.25", optional = true, default-features = false, features = ["png", "jpeg", "webp", "bmp", "gif"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
# Text rasterization for the OCR round-trip example.
imageproc = "0.25"
ab_glyph = "0.2"

[features]
default = ["ocr-paddle"]
# Build: cargo build --features ocr-paddle
ocr-paddle = ["dep:ocr-rs", "dep:image"]
# Additive: Metal + CoreML acceleration on macOS.
# Build (macOS): cargo build --features ocr-paddle-metal
ocr-paddle-metal = ["ocr-paddle", "ocr-rs/metal", "ocr-rs/coreml"]

# OCR round-trip verification harness (renders text, reads it back, reports
# word recall). Gated so plain `cargo build --examples` without OCR support
# doesn't try to compile against the MNN-backed engine.
[[example]]
name = "ocr_roundtrip"
required-features = ["ocr-paddle"]
