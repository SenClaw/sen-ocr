name: release

# Tag push (`v0.1.0`, …) → build the OCR runtime per platform, package it per
# senclaw/docs/runtime-protocol.md §2.3, publish the archives + sha256 on the
# GitHub release. Checks out SenClaw/senclaw as a sibling directory so the
# `../senclaw/crates/sen-runtime-sdk` path dependency resolves.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: darwin-arm64
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          # windows-arm64 is declared in senclaw-runtime.json's platform list
          # but needs a cross toolchain this workflow does not set up yet;
          # build it manually with `make package` on native hardware.
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: sen-ocr
      - uses: actions/checkout@v4
        with:
          repository: SenClaw/senclaw
          path: senclaw
      - uses: dtolnay/rust-toolchain@stable
      - name: install cmake (MNN build)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y cmake clang
      - name: make package
        working-directory: sen-ocr
        shell: bash
        env:
          CARGO_BUILD_JOBS: "4"
        run: make package
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            sen-ocr/dist/*.tar.gz
            sen-ocr/dist/*.tar.gz.sha256
